name: 🍎 macOS Clean Build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  APP_NAME: Orca
  BUNDLE_ID: com.orca.engine
  TEAM_ID: 92HMJ7DFHF
  VERSION_BASE: "0.01"

jobs:
  build-sign-notarize:
    name: Build Sign Notarize Orca
    runs-on: macos-14
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install scons

      - name: Build Orca Engine
        run: |
          scons platform=macos target=editor dev_build=no arch=arm64 vulkan=no -j$(sysctl -n hw.ncpu)

      - name: Create App Bundle
        id: bundle
        run: |
          BIN="bin/orca.macos.editor.arm64"
          if [ ! -f "$BIN" ]; then
            BIN="bin/godot.macos.editor.arm64"
          fi
          if [ ! -f "$BIN" ]; then
            BIN="bin/godot.macos.editor.dev.arm64"
          fi
          
          if [ ! -f "$BIN" ]; then
            echo "Built binary not found"
            ls -la bin/
            exit 1
          fi
          
          # Create app bundle structure
          mkdir -p "Orca.app/Contents/MacOS"
          mkdir -p "Orca.app/Contents/Resources"
          
          # Copy binary
          install -m 755 "$BIN" "Orca.app/Contents/MacOS/Orca"
          
          # Create Info.plist
          cat > "Orca.app/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CFBundleExecutable</key>
          	<string>Orca</string>
          	<key>CFBundleIdentifier</key>
          	<string>com.orca.engine</string>
          	<key>CFBundleName</key>
          	<string>Orca Engine</string>
          	<key>CFBundleDisplayName</key>
          	<string>Orca Engine</string>
          	<key>CFBundleShortVersionString</key>
          	<string>${{ env.VERSION_BASE }}.${{ github.run_number }}</string>
          	<key>CFBundleVersion</key>
          	<string>${{ github.run_number }}</string>
          	<key>CFBundlePackageType</key>
          	<string>APPL</string>
          	<key>CFBundleSignature</key>
          	<string>ORCA</string>
          	<key>LSMinimumSystemVersion</key>
          	<string>11.0</string>
          	<key>CFBundleIconFile</key>
          	<string>Orca.icns</string>
          	<key>NSHighResolutionCapable</key>
          	<true/>
          	<key>NSSupportsAutomaticGraphicsSwitching</key>
          	<true/>
          </dict>
          </plist>
          EOF
          
          # Copy icon if available
          if [ -f "Orca.icns" ]; then
            cp "Orca.icns" "Orca.app/Contents/Resources/"
          elif [ -f "icon.icns" ]; then
            cp "icon.icns" "Orca.app/Contents/Resources/Orca.icns"
          fi
          
          echo "app-path=Orca.app" >> "$GITHUB_OUTPUT"
          echo "✅ Orca.app created with proper bundle structure"

      - name: Import Certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          if [ -n "$CERT_P12_BASE64" ]; then
            echo "$CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import /tmp/cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            echo "✅ Certificate imported"
          fi

      - name: Code Sign
        run: |
          IDENTITY="Developer ID Application: Simplifine Corp (92HMJ7DFHF)"
          
          # Use proper entitlements for notarization
          /usr/bin/codesign --force --deep --options runtime --timestamp \
            --entitlements "misc/dist/macos/editor.entitlements" \
            --sign "$IDENTITY" "Orca.app"
          
          /usr/bin/codesign --verify --deep --strict "Orca.app"
          echo "✅ Code signed with entitlements"

      - name: Create Notarization Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Orca.app" "Orca.zip"
          echo "✅ Notarization package created"

      - name: Submit for Notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool submit "Orca.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "92HMJ7DFHF" \
              --wait --timeout 30m
            echo "✅ Notarization submitted"
          fi

      - name: Staple Notarization Ticket
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun stapler staple "Orca.app"
            xcrun stapler validate "Orca.app"
            spctl -a -vvv "Orca.app"
            echo "✅ Notarization ticket stapled and validated"
          fi

      - name: Create DMG
        run: |
          hdiutil create -volname "Orca Engine" -srcfolder "Orca.app" -ov -format UDZO "Orca (Mac).dmg"
          echo "✅ DMG created"
          
          # Sign the DMG as well
          IDENTITY="Developer ID Application: Simplifine Corp (92HMJ7DFHF)"
          /usr/bin/codesign --force --sign "$IDENTITY" "Orca (Mac).dmg"
          /usr/bin/codesign --verify --deep --strict "Orca (Mac).dmg"
          echo "✅ DMG signed"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Orca-macOS-Production
          path: |
            Orca.app
            Orca (Mac).dmg

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION_BASE }}.${{ github.run_number }}
          name: Orca Engine v${{ env.VERSION_BASE }}.${{ github.run_number }}
          body: |
            🚀 **Orca Engine Release v${{ env.VERSION_BASE }}.${{ github.run_number }}**
            
            🍎 **Mac**: Automatically built, signed & notarized
            🏁 **Windows**: Automatically built & signed with SSL.com certificate  
            🐧 **Linux**: Automatically built for x86_64 (Ubuntu 18.04+ compatible)
            
            **Changes in this build:**
            ${{ github.event.head_commit.message }}
          files: |
            Orca (Mac).dmg
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          append_body: false
