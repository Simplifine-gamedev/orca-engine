name: 🚀 Publish Release

on:
  workflow_run:
    workflows: 
      - "🐧 Linux Production Build"
      - "🍎 macOS Clean Build"  
      - "🏁 Windows Production Build"
    types:
      - completed
    branches: [ main ]

permissions:
  contents: write

# Prevent multiple instances from publishing the same release simultaneously
concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-when-all-complete:
    name: Publish Release When All Platforms Complete
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait and Check All Workflows Complete
        id: wait
        run: |
          # Get the commit SHA from the triggering workflow
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Checking workflows for commit: $COMMIT_SHA"
          
          # Wait a bit to ensure all workflows are registered in the API
          echo "Waiting 30 seconds for workflow registration..."
          sleep 30
          
          # Retry logic: check up to 20 times with 1-minute delays (up to 20 minutes)
          MAX_RETRIES=20
          RETRY_DELAY=60
          ALL_SUCCESS=false
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "========== Attempt $i/$MAX_RETRIES =========="
            
            # Get all workflow runs for this commit
            WORKFLOW_DATA=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$COMMIT_SHA&event=push&per_page=100")
            
            # Extract status for each required workflow
            LINUX_STATUS=$(echo "$WORKFLOW_DATA" | jq -r '.workflow_runs[] | select(.name == "🐧 Linux Production Build") | .conclusion' | head -1)
            MACOS_STATUS=$(echo "$WORKFLOW_DATA" | jq -r '.workflow_runs[] | select(.name == "🍎 macOS Clean Build") | .conclusion' | head -1)
            WINDOWS_STATUS=$(echo "$WORKFLOW_DATA" | jq -r '.workflow_runs[] | select(.name == "🏁 Windows Production Build") | .conclusion' | head -1)
            
            echo "Workflow Status Check:"
            echo "  🐧 Linux: '$LINUX_STATUS'"
            echo "  🍎 macOS: '$MACOS_STATUS'"
            echo "  🏁 Windows: '$WINDOWS_STATUS'"
            
            # Check if all workflows completed successfully
            if [[ "$LINUX_STATUS" == "success" && "$MACOS_STATUS" == "success" && "$WINDOWS_STATUS" == "success" ]]; then
              echo ""
              echo "✅ All workflows completed successfully!"
              ALL_SUCCESS=true
              break
            else
              echo ""
              echo "⏳ Not all workflows completed yet"
              
              # If this is not the last retry, wait before trying again
              if [[ $i -lt $MAX_RETRIES ]]; then
                echo "Waiting $RETRY_DELAY seconds before retry..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          if [[ "$ALL_SUCCESS" == "true" ]]; then
            echo "all_complete=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Final check: Not all workflows completed successfully"
            echo "This workflow will not publish the release"
            echo "all_complete=false" >> $GITHUB_OUTPUT
          fi

      - name: Get Release Version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-8)
          RELEASE_VERSION="0.01.$SHORT_SHA"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Found release version: $RELEASE_VERSION"

      - name: Publish Draft Release
        if: steps.wait.outputs.all_complete == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${{ steps.version.outputs.release_version }}"
          echo "Publishing release: $RELEASE_TAG"
          
          # Get the release ID from list (draft releases don't work with /releases/tags/ endpoint)
          RELEASE_ID=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "❌ Release not found: $RELEASE_TAG"
            echo "Listing recent releases:"
            curl -s \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              | jq -r '.[] | "\(.tag_name) draft=\(.draft)"' | head -5
            exit 1
          fi
          
          echo "Found release ID: $RELEASE_ID"
          
          # Update the release to publish it (set draft: false)
          RELEASE_BODY="🚀 **Orca Engine Release v${{ steps.version.outputs.release_version }}**

## Download for Your Platform:

🍎 **Mac**: Download \`Orca (Mac).dmg\` → Open DMG → Drag to Applications  
🏁 **Windows**: Download \`Orca (Windows).exe\` → Run directly  
🐧 **Linux**: Download \`Orca-Linux-x86_64.tar.gz\` → Extract and run \`./Orca\`

## What's New:
${{ github.event.workflow_run.head_commit.message }}

---
**All builds completed**: Mac ✅ Signed & Notarized | Linux ✅ | Windows ✅

### Build Details:
- **Linux x86_64**: Complete editor with all features
- **Windows x86_64**: Code-signed editor with all features  
- **macOS Universal**: Notarized editor supporting Intel + Apple Silicon

*Auto-update supported - The editor will notify you of newer versions.*"
          
          curl -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d "$(jq -n \
              --arg name "Orca Engine v${{ steps.version.outputs.release_version }}" \
              --arg body "$RELEASE_BODY" \
              '{draft: false, name: $name, body: $body}')"
          
          echo "✅ Release published successfully: $RELEASE_TAG"

      - name: Summary
        if: always()
        run: |
          echo "# 🚀 Publish Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.wait.outputs.all_complete }}" = "true" ]; then
            echo "🎉 SUCCESS: Release v${{ steps.version.outputs.release_version }} published!"
            echo "All platform builds completed and release is now public."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ✅ Success!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release **v${{ steps.version.outputs.release_version }}** has been published successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All platform builds completed:" >> $GITHUB_STEP_SUMMARY
            echo "- 🐧 Linux ✅" >> $GITHUB_STEP_SUMMARY
            echo "- 🍎 macOS ✅" >> $GITHUB_STEP_SUMMARY
            echo "- 🏁 Windows ✅" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.release_version }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ SKIPPED: Not publishing yet"
            echo "One or more platform builds are still in progress or incomplete."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ⏭️ Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Not all platform builds completed successfully yet." >> $GITHUB_STEP_SUMMARY
            echo "Another workflow instance will publish when all builds complete." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** This is normal behavior when builds complete at different times." >> $GITHUB_STEP_SUMMARY
          fi
