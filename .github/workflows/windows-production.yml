name: 🏁 Windows Production Build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  APP_NAME: Orca
  VERSION_BASE: "0.01"
  # Use date-based version for consistent releases across platforms
  RELEASE_VERSION: "0.01.${{ github.run_number }}"

jobs:
  build-sign-release:
    name: Build Sign Release Orca Windows
    runs-on: windows-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Remove any submodule references
        shell: bash
        run: |
          rm -f .gitmodules
          git config --remove-section submodule.emsdk 2>/dev/null || true

      - name: Setup Python and SCons
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.1

      - name: Build Orca Engine
        run: |
          scons platform=windows target=editor dev_build=no arch=x86_64 -j4

      - name: Verify Build
        shell: cmd
        run: |
          echo "🔍 Verifying build output..."
          
          REM Check if binary exists
          if not exist "bin\godot.windows.editor.x86_64.exe" (
            echo "❌ Built binary not found: bin\godot.windows.editor.x86_64.exe"
            echo "Contents of bin directory:"
            dir bin\
            echo "Looking for alternative binary names..."
            if exist "bin\orca.windows.editor.x86_64.exe" (
              echo "Found alternative: bin\orca.windows.editor.x86_64.exe"
              copy "bin\orca.windows.editor.x86_64.exe" "bin\godot.windows.editor.x86_64.exe"
            ) else (
              echo "No suitable binary found"
              exit /b 1
            )
          )
          
          REM Check file size
          for %%A in (bin\godot.windows.editor.x86_64.exe) do set size=%%~zA
          echo "Binary size: %size% bytes"
          
          if %size% LEQ 0 (
            echo "❌ Binary is empty or corrupted"
            exit /b 1
          )
          
          echo "✅ Build successful - Binary verified"

      - name: Setup Java for Code Signing
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup CodeSignTool
        shell: powershell
        run: |
          Write-Host "🔧 Setting up SSL.com CodeSignTool..."
          
          # Check if CodeSignTool JAR already exists in repo
          if (Test-Path "jar\code_sign_tool-1.3.2.jar") {
              $fileSize = (Get-Item "jar\code_sign_tool-1.3.2.jar").Length
              Write-Host "✅ CodeSignTool JAR found in repository - Size: $fileSize bytes"
          } else {
              Write-Host "❌ CodeSignTool JAR not found in repository"
              Write-Host "Expected location: jar\code_sign_tool-1.3.2.jar"
              exit 1
          }
          
          # Create config file  
          New-Item -ItemType Directory -Force -Path "conf"
          "# SSL.com CodeSignTool Configuration" | Out-File -FilePath "conf\code_sign_tool.properties" -Encoding ASCII
          "CLIENT_ID=" | Add-Content -Path "conf\code_sign_tool.properties" -Encoding ASCII
          "OAUTH2_ENDPOINT=https://oauth.ssl.com/oauth2/token" | Add-Content -Path "conf\code_sign_tool.properties" -Encoding ASCII
          "CSC_API_ENDPOINT=https://cs.ssl.com" | Add-Content -Path "conf\code_sign_tool.properties" -Encoding ASCII
          "TSA_URL=http://ts.ssl.com" | Add-Content -Path "conf\code_sign_tool.properties" -Encoding ASCII
          
          Write-Host "✅ CodeSignTool setup complete"
          Write-Host "SUCCESS: Config file created"

      - name: Verify Code Signing Tools
        shell: cmd
        run: |
          echo "🔍 Verifying code signing tools..."
          
          REM Check if JAR exists
          if not exist "jar\code_sign_tool-1.3.2.jar" (
            echo "❌ CodeSignTool JAR not found"
            exit /b 1
          )
          
          REM Check JAR file size
          for %%A in (jar\code_sign_tool-1.3.2.jar) do set size=%%~zA
          echo "📄 CodeSignTool JAR size: %size% bytes"
          
          REM Verify Java installation
          java -version
          
          REM Test JAR execution
          echo "🧪 Testing JAR execution..."
          java -jar jar\code_sign_tool-1.3.2.jar --help >nul 2>&1
          if %ERRORLEVEL% equ 0 (
            echo "✅ CodeSignTool JAR is executable"
          ) else (
            echo "⚠️ CodeSignTool JAR test failed (may be normal - requires args)"
          )
          
          echo "✅ Code signing tools verified"

      - name: Sign Windows Binary
        shell: cmd
        id: sign_binary
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: |
          echo "🔐 Starting Windows binary signing..."
          
          REM Create signed directory
          mkdir bin\signed
          
          REM Copy binary to signed directory
          copy bin\godot.windows.editor.x86_64.exe bin\signed\orca-windows-production.exe
          
          REM Check if credentials are available
          if "%SSL_COM_USERNAME%"=="" (
            echo "⚠️ SSL_COM_USERNAME not set - will create unsigned binary"
            echo "📋 Creating unsigned distribution binary..."
            copy bin\signed\orca-windows-production.exe "Orca (Windows).exe"
            echo "✅ Unsigned binary created for distribution"
            goto :eof
          )
          if "%SSL_COM_PASSWORD%"=="" (
            echo "⚠️ SSL_COM_PASSWORD not set - will create unsigned binary"
            echo "📋 Creating unsigned distribution binary..."
            copy bin\signed\orca-windows-production.exe "Orca (Windows).exe"
            echo "✅ Unsigned binary created for distribution"
            goto :eof
          )
          
          echo "🔏 Signing with SSL.com CodeSignTool..."
          
          REM Sign the binary with proper path
          java -jar ".\jar\code_sign_tool-1.3.2.jar" sign ^
            -username="%SSL_COM_USERNAME%" ^
            -password="%SSL_COM_PASSWORD%" ^
            -credential_id="00987e95-0523-49f1-a7a9-8c71d6cec2d9" ^
            -totp_secret="%SSL_COM_TOTP_SECRET%" ^
            -input_file_path="bin\signed\orca-windows-production.exe" ^
            -output_dir_path="bin\signed"
          
          REM Verify signing was successful
          if %ERRORLEVEL% neq 0 (
            echo "❌ Code signing failed with exit code %ERRORLEVEL%"
            exit /b 1
          )
          
          echo "✅ Windows binary signed successfully"

      - name: Verify Binary
        shell: cmd
        run: |
          echo "🔍 Verifying binary..."
          
          REM Check if signed binary exists
          if not exist "bin\signed\orca-windows-production.exe" (
            echo "⚠️ Signed binary not found, checking for unsigned binary"
            echo "Contents of bin\signed:"
            dir bin\signed\
            
            REM Fallback: copy original binary if signing failed
            if exist "bin\godot.windows.editor.x86_64.exe" (
              echo "📋 Using unsigned binary as fallback"
              copy "bin\godot.windows.editor.x86_64.exe" "bin\signed\orca-windows-production.exe"
            ) else (
              echo "❌ No binary found to distribute"
              exit /b 1
            )
          )
          
          REM Check file size (should be > 0)
          for %%A in (bin\signed\orca-windows-production.exe) do set size=%%~zA
          if %size% LEQ 0 (
            echo "❌ Binary is empty or corrupted"
            exit /b 1
          )
          
          echo "✅ Binary verified (size: %size% bytes)"
          
          REM Check if signing was successful
          if "${{ steps.sign_binary.outcome }}"=="success" (
            echo "🔐 Binary is digitally signed"
          ) else (
            echo "⚠️ Binary is unsigned (signing failed or skipped)"
          )

      - name: Rename for Distribution
        shell: cmd
        run: |
          echo "📝 Preparing distribution binary..."
          
          REM Copy signed binary to distribution name
          copy "bin\signed\orca-windows-production.exe" "Orca (Windows).exe"
          
          REM Verify distribution binary
          if not exist "Orca (Windows).exe" (
            echo "❌ Distribution binary creation failed"
            exit /b 1
          )
          
          echo "✅ Binary renamed for distribution"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Orca Engine v${{ env.RELEASE_VERSION }}
          body: |
            🚀 **Orca Engine Release v${{ env.RELEASE_VERSION }}**
            
            🍎 **Mac**: Automatically built, signed & notarized
            🏁 **Windows**: Automatically built${{ steps.sign_binary.outcome == 'success' && ' & signed with SSL.com certificate' || ' (unsigned - signing failed)' }}
            
            **Changes in this build:**
            ${{ github.event.head_commit.message }}
            
            **Download Instructions:**
            - **Mac**: Download DMG, mount, drag to Applications
            - **Windows**: Download EXE${{ steps.sign_binary.outcome == 'success' && ', run directly (no security warnings)' || ' (may show security warning - unsigned)' }}
          files: |
            Orca (Windows).exe
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        shell: cmd
        run: |
          echo "📄 Windows Build Summary:"
          echo "=============================="
          echo "Build Status: Success"
          echo "Signing Status: ${{ steps.sign_binary.outcome }}"
          
          if exist "Orca (Windows).exe" (
            for %%A in ("Orca (Windows).exe") do echo "Distribution Binary: %%~zA bytes"
          ) else (
            echo "Distribution Binary: NOT FOUND"
          )
          
          if exist "bin\signed\orca-windows-production.exe" (
            for %%A in (bin\signed\orca-windows-production.exe) do echo "Signed Binary: %%~zA bytes"
          ) else (
            echo "Signed Binary: NOT FOUND"
          )
          
          echo "=============================="

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Orca-Windows-Production
          path: |
            Orca (Windows).exe
            bin/signed/orca-windows-production.exe
